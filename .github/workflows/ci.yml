name: CI

on:
  push:
    branches: ["*"]
  workflow_dispatch:
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: Build
        run: npm ci

      - name: Build
        working-directory: Build
        run: npm run build

      - name: Build single file
        working-directory: Build
        run: npm run build:single
